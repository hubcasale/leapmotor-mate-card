<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leapmotor Mate Card — demo</title>
<style>
  :root {
    --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
    --text-primary-color: #fff; --card-background-color: #fff; --divider-color: #e0e0e0;
    --disabled-text-color: #bdbdbd; --page: #f3f4f6;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root.dark {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c;
    --divider-color: #2c2c2c; --disabled-text-color: #6f6f6f; --page: #111;
  }
  body { margin: 0; padding: 16px; background: var(--page); color: var(--primary-text-color); }
  #cards { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .cell { width: 400px; }
</style>
<div id="cards"></div>
<script src="demo.js"></script>
</html>
